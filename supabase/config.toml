# Minimal Supabase CLI config. Run `supabase link --project-ref <ref>` to bind
# this directory to the hosted project, then `supabase db push` to apply
# ./migrations. `supabase start` + `supabase db reset` run the stack locally and
# apply ./seed.sql.
project_id = "tempus"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
